name: static-qt

# One-off builder for a *static* Qt on Windows (qtbase only). This is deliberately
# workflow_dispatch only: it is slow (a Qt build from source), and its job is to fill
# the actions/cache entry that the regular build workflow can then restore in seconds.
#
# Requirements for a larger runner: GitHub-hosted larger runners are not available on
# the Free organization plan (the API answers "GitHub hosted runners are not supported
# for this organization"), so this default runs on the standard windows-latest runner
# and spends the included minutes. If the org is upgraded to Team/Enterprise and a
# larger runner (e.g. windows-latest-8-cores) is available, pass its label as `runner`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "configure = fast smoke test (no Qt build); full = build Qt, cache it and build the static app"
        required: true
        default: configure
        type: choice
        options:
          - configure
          - full
      runner:
        description: "Runner label (windows-latest on Free; larger labels need Team/Enterprise)"
        required: true
        default: windows-latest
        type: string
      qt_version:
        description: "Qt version to build from source"
        required: true
        default: "6.12.0"
        type: string

permissions:
  contents: read

concurrency:
  group: static-qt-${{ inputs.qt_version }}
  cancel-in-progress: false

jobs:
  build-static-qt:
    name: Static Qt ${{ inputs.qt_version }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      QT_PREFIX: C:\Qt\6.12.0-static
      QT_SRC_ROOT: C:\Qt\src
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Qt source tarball is ~1 GB and never changes; cache it so retries only pay
      # for the Qt build itself.
      - name: Restore Qt source cache
        id: qtsrc
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_SRC_ROOT }}
          key: qt-src-${{ inputs.qt_version }}-v1

      - name: Download Qt source
        if: steps.qtsrc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade aqtinstall
          python -m aqt install-src windows desktop ${{ inputs.qt_version }} `
            --outputdir "$env:QT_SRC_ROOT"

      - name: Locate Qt source tree
        id: src
        shell: pwsh
        run: |
          $configure = Get-ChildItem "$env:QT_SRC_ROOT" -Recurse -Filter configure.bat |
            Where-Object { Test-Path (Join-Path (Split-Path $_.FullName -Parent) "qtbase") } |
            Select-Object -First 1
          if (-not $configure) { throw "configure.bat (with a qtbase sibling) was not found" }
          $root = Split-Path $configure.FullName -Parent
          Write-Host "Qt source: $root"
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore static Qt cache
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-windows-msvc-${{ inputs.qt_version }}-v1

      - name: Configure static Qt (configure-only smoke test)
        if: inputs.mode == 'configure' && steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "${{ steps.src.outputs.path }}"
          # Build only qtbase. Skip-lists are a trap: new top-level modules can
          # declare dependencies on a skipped module (e.g. qtcanvaspainter depends on
          # qtdeclarative) and the whole configure fails with a dangling dependency.
          $args = @(
            "-static", "-static-runtime", "-release", "-prefix", $env:QT_PREFIX,
            "-cmake-generator", "Ninja",
            "-nomake", "examples", "-nomake", "tests",
            "-submodules", "qtbase",
            "-no-opengl",
            "--",
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          )
          Write-Host "configure.bat $($args -join ' ')"
          & .\configure.bat @args
          if ($LASTEXITCODE -ne 0) { throw "Qt configure failed with exit code $LASTEXITCODE" }
          # configure.bat can return 0 after the inner CMake configure failed; the
          # generated build files are the only reliable success signal.
          if (-not (Test-Path "build.ninja")) {
            throw "Qt configure did not produce build.ninja (inner CMake configure failed)"
          }
          Get-ChildItem -Path . -Filter "config.*" | ForEach-Object { Write-Host $_.Name }

      - name: Configure static Qt
        if: inputs.mode == 'full' && steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "${{ steps.src.outputs.path }}"
          # Build only qtbase. Skip-lists are a trap: new top-level modules can
          # declare dependencies on a skipped module (e.g. qtcanvaspainter depends on
          # qtdeclarative) and the whole configure fails with a dangling dependency.
          $args = @(
            "-static", "-static-runtime", "-release", "-prefix", $env:QT_PREFIX,
            "-cmake-generator", "Ninja",
            "-nomake", "examples", "-nomake", "tests",
            "-submodules", "qtbase",
            "-no-opengl",
            "--",
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          )
          Write-Host "configure.bat $($args -join ' ')"
          & .\configure.bat @args
          if ($LASTEXITCODE -ne 0) { throw "Qt configure failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "build.ninja")) {
            throw "Qt configure did not produce build.ninja (inner CMake configure failed)"
          }

      - name: Build and install static Qt
        if: inputs.mode == 'full' && steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "${{ steps.src.outputs.path }}"
          Write-Host "building with $env:NUMBER_OF_PROCESSORS parallel jobs"
          cmake --build . --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "Qt build failed with exit code $LASTEXITCODE" }
          cmake --install .
          if ($LASTEXITCODE -ne 0) { throw "Qt install failed with exit code $LASTEXITCODE" }

      - name: Verify the kit is really static
        if: inputs.mode == 'full'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:QT_PREFIX\lib\Qt6Core.lib")) {
            throw "missing $env:QT_PREFIX\lib\Qt6Core.lib"
          }
          if (Test-Path "$env:QT_PREFIX\bin\Qt6Core.dll") {
            throw "the prefix still contains Qt6Core.dll; this is a shared Qt kit"
          }
          $qconfig = "$env:QT_PREFIX\mkspecs\qconfig.pri"
          if (-not (Test-Path $qconfig)) { throw "missing $qconfig" }
          $line = (Select-String -Path $qconfig -Pattern '^QT_CONFIG\s*\+=' | Select-Object -First 1).Line
          Write-Host "qconfig: $line"
          if ($line -notmatch '\bstatic\b') { throw "qconfig.pri does not report a static Qt build" }
          Write-Host "ok: static Qt kit at $env:QT_PREFIX"

      - name: Save static Qt cache (before the app build / render)
        if: inputs.mode == 'full' && steps.qtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-windows-msvc-${{ inputs.qt_version }}-v1

      - name: Archive static Qt
        if: inputs.mode == 'full'
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip a -t7z -mx=5 "qt-static-${{ inputs.qt_version }}.7z" $env:QT_PREFIX
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          } else {
            Compress-Archive -Path $env:QT_PREFIX -DestinationPath "qt-static-${{ inputs.qt_version }}.zip"
          }

      - name: Upload static Qt artifact (before the app build / render)
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: qt-static-${{ inputs.qt_version }}-windows
          path: qt-static-${{ inputs.qt_version }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload configure artifacts (smoke test)
        if: inputs.mode == 'configure'
        uses: actions/upload-artifact@v4
        with:
          name: qt-configure-${{ inputs.qt_version }}
          path: |
            ${{ steps.src.outputs.path }}/config.summary
            ${{ steps.src.outputs.path }}/config.opt
          if-no-files-found: warn
          retention-days: 7

      - name: Build the application against the static Qt
        if: inputs.mode == 'full'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 `
            -QtDir $env:QT_PREFIX -StaticQt -Generator Ninja `
            -Jobs $([Environment]::ProcessorCount) -Deploy -Zip
          if ($LASTEXITCODE -ne 0) { throw "static application build failed with exit code $LASTEXITCODE" }

      - name: Upload static DaHoWork zip (before the render check)
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: DaHoWork-win64-static
          path: |
            dist/DaHoWork-win64.zip
            build/apps/qt/DaHoWork.exe
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "mode=${{ inputs.mode }} runner=${{ inputs.runner }} qt=${{ inputs.qt_version }}"
          Write-Host "cache key: qt-static-windows-msvc-${{ inputs.qt_version }}-v1"
          if (Test-Path $env:QT_PREFIX) {
            Write-Host ("static prefix size: {0:N1} MB" -f ((Get-ChildItem $env:QT_PREFIX -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))
          }
