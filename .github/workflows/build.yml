name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# sccache's GitHub Actions cache backend; the compiler launcher itself is set in
# cmake (see the jobs below / scripts/build-windows.ps1).
env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    name: Windows (MSVC, Qt 6.10.3)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compile cache shared between runs. The Windows build script detects
      # sccache on PATH and passes it as CMAKE_CXX_COMPILER_LAUNCHER.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Qt 6.11+ ships Windows binaries in per-architecture repository folders
      # (qt6_6120/qt6_6120_msvc2022_64/Updates.xml). install-qt-action pins
      # aqtinstall 3.3.0, which still asks for the old
      # qt6_6120/qt6_6120/Updates.xml and fails with "Failed to locate XML data".
      # 6.10.3 is the newest Windows Qt that aqtinstall 3.3.0 can install;
      # CMakeLists only requires Qt >= 6.4.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true

      # windows-latest now ships Visual Studio 2026 (v18), but the CMake 4.4.4
      # bundled with the image only advertises the VS 17 2022 generator, so the
      # script cannot configure with a Visual Studio generator ("could not find
      # any instance of Visual Studio"). Use the Ninja fallback that
      # docs/BUILD-WINDOWS.md recommends, after putting cl.exe/rc.exe on PATH.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same entry point as a developer on Windows: configure, build, ctest,
      # windeployqt and the dist zip. The script fails the step if ctest fails.
      - name: Build, test, deploy, package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 `
            -QtDir $env:QT_ROOT_DIR -Generator Ninja `
            -Jobs $([Environment]::ProcessorCount) -Deploy -Zip

      - name: Headless render (1920x1080)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $data = Join-Path $env:RUNNER_TEMP "dhw-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Copy-Item "fixtures\demo\data.json" (Join-Path $data "data.json") -Force
          New-Item -ItemType Directory -Force -Path "build\verify" | Out-Null
          # Visual Studio generators put the exe under Release\, Ninja does not.
          $exe = @(
            "build\apps\qt\Release\DaHoWork.exe",
            "build\apps\qt\DaHoWork.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "DaHoWork.exe was not found in the build tree" }
          $renderPath = "build\verify\render-1920x1080.png"
          # DaHoWork.exe is a GUI-subsystem binary: PowerShell does not wait for it
          # and leaves $LASTEXITCODE empty when it is invoked with the call operator,
          # so use Start-Process -Wait and read its ExitCode instead.
          $process = Start-Process -FilePath $exe -Wait -PassThru `
            -ArgumentList @("--data-dir", $data, "--date", "2026-10-12",
                            "--render", $renderPath)
          if ($process.ExitCode -ne 0) {
            throw "render exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path $renderPath)) { throw "render output is missing" }
          $bytes = [System.IO.File]::ReadAllBytes($renderPath)
          $width = ([int]($bytes[16]) -shl 24) -bor ([int]($bytes[17]) -shl 16) -bor `
                   ([int]($bytes[18]) -shl 8) -bor [int]($bytes[19])
          $height = ([int]($bytes[20]) -shl 24) -bor ([int]($bytes[21]) -shl 16) -bor `
                    ([int]($bytes[22]) -shl 8) -bor [int]($bytes[23])
          Write-Host "render: ${width}x${height}"
          if ($width -ne 1920 -or $height -ne 1080) {
            throw "render is ${width}x${height}, expected 1920x1080"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaHoWork-win64
          path: |
            dist/DaHoWork-win64.zip
            build/verify/render-1920x1080.png
          if-no-files-found: error

  macos:
    name: macOS (Clang, Qt 6.12.0)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The shell and the CLI must rasterise the same layout module to identical
      # pixels; this is the invariant scripts/verify-macos.sh guards locally.
      - name: Headless export consistency
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dhw-data"
          mkdir -p "$work"
          cp fixtures/demo/data.json "$work/data.json"
          build/tools/dhw_render_cli --data "$work/data.json" --date 2026-10-12 \
            --out "$RUNNER_TEMP/cli.png"
          build/apps/qt/DaHoWork --data-dir "$work" --date 2026-10-12 \
            --render "$RUNNER_TEMP/app.png"
          cli_hash="$(shasum -a 256 "$RUNNER_TEMP/cli.png" | cut -d' ' -f1)"
          app_hash="$(shasum -a 256 "$RUNNER_TEMP/app.png" | cut -d' ' -f1)"
          echo "cli=$cli_hash"
          echo "app=$app_hash"
          if [ "$cli_hash" != "$app_hash" ]; then
            echo "::error::CLI and shell exports are not byte identical"
            exit 1
          fi
          cp "$RUNNER_TEMP/app.png" render-1920x1080.png

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/DaHoWork-macos
          cp build/apps/qt/DaHoWork build/tools/dhw_render_cli build/tests/dhw_tests \
            dist/DaHoWork-macos/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/DaHoWork-macos/
          cp -R LICENSES dist/DaHoWork-macos/
          tar -czf dist/DaHoWork-macos-build.tar.gz -C dist DaHoWork-macos
          mv render-1920x1080.png dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaHoWork-macos
          path: |
            dist/DaHoWork-macos-build.tar.gz
            dist/render-1920x1080.png
          if-no-files-found: error
